<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="熄火">
<title>熄火</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#000;
  --card:#0e0e10;
  --card2:#15151a;
  --accent:#ff7a2f;
  --accent2:#ffa566;
  --danger:#ff5c5c;
  --ok:#4ade80;
  --text:#f2ece4;
  --muted:#8a847c;
  --border:rgba(255,122,47,.22);
  --gold:#e6b84a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100%}
body{
  background:radial-gradient(1200px 600px at 50% -200px, rgba(255,122,47,.14), transparent 60%), var(--bg);
  padding:env(safe-area-inset-top) 20px calc(env(safe-area-inset-bottom) + 20px);
}
/* 隐藏滚动条：页面仍可滚动，只是不显示上下滑动滑块 */
html,body{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0}
#app{max-width:480px;margin:0 auto}

/* ===== 顶栏 ===== */
header{display:flex;align-items:center;justify-content:space-between;
  padding:18px 0 8px;position:relative}
.brand{display:flex;align-items:center;gap:10px}
.brand .fire{font-size:22px;filter:drop-shadow(0 0 6px rgba(255,122,47,.6))}
.brand h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.5px}
.brand .sub{font-size:11px;color:var(--muted);letter-spacing:2px}
.gear{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);
  background:var(--card);color:var(--muted);font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:transform .3s}
.gear:active{transform:rotate(60deg)}

/* ===== 计数主区 ===== */
.counter-wrap{text-align:center;padding:26px 0 10px}
.count-num{font-size:96px;font-weight:800;line-height:1;letter-spacing:-2px;
  background:linear-gradient(180deg,#ff6b6b,#ff2d1a);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;transition:color .3s}
.count-num.over{background:linear-gradient(180deg,#ff9c9c,#ff1414);-webkit-background-clip:text;background-clip:text}
.count-label{color:var(--muted);font-size:14px;margin-top:6px;letter-spacing:1px}
.resist-count{color:var(--ok);font-size:13px;margin-top:8px;letter-spacing:1px;min-height:18px;font-weight:600}
.goal-bar{width:min(240px,70%);height:6px;border-radius:3px;background:var(--card2);
  margin:18px auto 8px;overflow:hidden}
.goal-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));
  transition:width .4s;box-shadow:0 0 10px rgba(255,122,47,.5)}
.goal-fill.over{background:linear-gradient(90deg,#ff5c5c,#ff8a8a);box-shadow:0 0 10px rgba(255,92,92,.5)}
.goal-text{font-size:12px;color:var(--muted);letter-spacing:1px}
.goal-text.over{color:var(--danger);font-weight:600}

/* ===== 主按钮（Zippo 翻盖打火机） ===== */
.btn-smoke{margin:22px auto 4px;width:100%;max-width:300px;height:322px;
  border:none;cursor:pointer;position:relative;background:none;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:12px;
  color:var(--text);-webkit-user-select:none;user-select:none;
  touch-action:none;-webkit-touch-callout:none;padding:0}
.btn-smoke.over .btn-hint{color:var(--danger)}
.btn-smoke .btn-hint{font-size:12px;font-weight:400;color:var(--muted);letter-spacing:1px}

/* 打火机主体（正面视角） */
.lighter{position:relative;width:132px;height:236px;perspective:720px;flex:none;
  filter:drop-shadow(0 16px 32px rgba(0,0,0,.5))}
/* 机身（银色 Zippo） */
.lighter .body{position:absolute;left:26px;top:72px;width:80px;height:142px;
  background:
    linear-gradient(100deg, rgba(255,255,255,.42) 0%, rgba(255,255,255,.06) 30%, rgba(255,255,255,0) 48%),
    repeating-linear-gradient(90deg, rgba(0,0,0,.04) 0 1px, rgba(255,255,255,.08) 1px 2px, transparent 2px 3px),
    linear-gradient(180deg,#f4f6f9 0%,#d7dbe0 45%,#bfc4cb 100%);
  border:1px solid #8f959e;border-radius:4px 4px 8px 8px;
  box-shadow:inset 0 -8px 16px rgba(0,0,0,.16), inset 0 2px 2px rgba(255,255,255,.85);
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.lighter .body .btn-text{color:#3c4048;font-size:14px;font-weight:800;letter-spacing:1px;white-space:nowrap}
/* 防风罩（带孔金属罩） */
.lighter .guard{position:absolute;left:29px;top:52px;width:74px;height:20px;z-index:2;
  background:linear-gradient(180deg,#cdd1d7,#aab0b8);
  border:2px solid #8f959e;border-radius:3px;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.5)}
.lighter .guard::after{content:"";position:absolute;left:7px;right:7px;top:3px;height:8px;
  background:
    radial-gradient(circle at 8px 4px,#5f656d 2.4px,transparent 3px),
    radial-gradient(circle at 26px 4px,#5f656d 2.4px,transparent 3px),
    radial-gradient(circle at 44px 4px,#5f656d 2.4px,transparent 3px),
    radial-gradient(circle at 60px 4px,#5f656d 2.4px,transparent 3px)}
/* 滑轮（圆形齿轮） */
.lighter .wheel{position:absolute;left:54px;top:44px;width:24px;height:24px;z-index:4;
  background:radial-gradient(circle at 50% 36%,#e2e6ea,#a4aab2 72%);
  border-radius:50%;box-shadow:0 2px 4px rgba(0,0,0,.45)}
.lighter .wheel::before{content:"";position:absolute;inset:-3px;border-radius:50%;
  background:repeating-conic-gradient(#b9bec5 0 20deg, transparent 20deg 40deg);
  -webkit-mask:radial-gradient(circle, transparent 60%, #000 62%);
  mask:radial-gradient(circle, transparent 60%, #000 62%)}
.lighter .wheel::after{content:"";position:absolute;inset:8px;border-radius:50%;background:#727a82}
/* 火花 */
.lighter .sparks{position:absolute;left:48px;top:30px;width:36px;height:28px;z-index:5;opacity:0;pointer-events:none}
.lighter .sparks i{position:absolute;width:3px;height:3px;border-radius:50%;
  background:#ffd54a;box-shadow:0 0 6px #ff8a3d;opacity:0}
.lighter.sparking .sparks{opacity:1}
.lighter.sparking .sparks i{animation:spark .3s ease-out infinite}
.lighter.sparking .sparks i:nth-child(1){left:3px;top:12px}
.lighter.sparking .sparks i:nth-child(2){left:12px;top:4px;animation-delay:.06s}
.lighter.sparking .sparks i:nth-child(3){left:22px;top:1px;animation-delay:.12s}
.lighter.sparking .sparks i:nth-child(4){left:32px;top:6px;animation-delay:.18s}
.lighter.sparking .sparks i:nth-child(5){left:17px;top:14px;animation-delay:.09s}
.lighter.sparking .sparks i:nth-child(6){left:5px;top:3px;animation-delay:.15s}
@keyframes spark{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-15px) scale(.35);opacity:0}}
/* 盖子（翻盖式：绕顶部铰链向后翻，翻到机身后面） */
.lighter .lid{position:absolute;left:26px;top:6px;width:80px;height:66px;z-index:6;
  transform-origin:50% 0%;transform-style:preserve-3d;will-change:transform,opacity;
  background:
    linear-gradient(100deg, rgba(255,255,255,.45) 0%, rgba(255,255,255,.06) 30%, rgba(255,255,255,0) 48%),
    repeating-linear-gradient(90deg, rgba(0,0,0,.04) 0 1px, rgba(255,255,255,.08) 1px 2px, transparent 2px 3px),
    linear-gradient(180deg,#f5f7fa 0%,#d8dce1 80%,#c0c5cc 100%);
  border:1px solid #8f959e;border-radius:6px 6px 2px 2px;
  box-shadow:0 2px 8px rgba(0,0,0,.2), inset 0 -2px 3px rgba(0,0,0,.06)}
.lighter .lid .lid-inner{position:absolute;inset:0;border-radius:6px 6px 2px 2px;
  background:linear-gradient(180deg,#cfd3d9,#b7bcc3);transform:translateZ(-1px)}
/* 火苗 */
.lighter .flame-box{position:absolute;left:28px;bottom:184px;width:76px;height:56px;z-index:3;
  opacity:0;transform-origin:bottom center;pointer-events:none}
.lighter.lit .flame-box{opacity:1;animation:flicker .16s infinite}
.lighter .flame-svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 12px rgba(255,120,40,.55))}
@keyframes flicker{
  0%{transform:scaleY(1) scaleX(1)}
  40%{transform:scaleY(1.08) scaleX(.93)}
  100%{transform:scaleY(.95) scaleX(1.05)}
}

.undo-row{display:flex;justify-content:center;gap:14px;min-height:44px;align-items:center}
.undo-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);
  background:var(--card);color:var(--muted);cursor:pointer;padding:0;
  display:inline-flex;align-items:center;justify-content:center;
  transition:color .2s, border-color .2s, transform .15s}
.undo-btn:active{color:var(--text);border-color:var(--accent);transform:scale(.94)}

/* ===== 时间线 ===== */
.tl-title{font-size:12px;color:var(--muted);letter-spacing:2px;margin:26px 0 10px;
  display:flex;align-items:center;justify-content:space-between}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid rgba(255,255,255,.04);
  font-size:14px}
.tl .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;
  box-shadow:0 0 6px rgba(255,122,47,.6)}
.tl .dot.resist{background:var(--ok);box-shadow:0 0 6px rgba(74,222,128,.6)}
.tl .idx{color:var(--muted);font-size:12px;width:44px;flex:none}
.tl .time{font-variant-numeric:tabular-nums}
.tl .gap{margin-left:auto;color:var(--muted);font-size:12px}
.tl .empty{color:var(--muted);text-align:center;padding:24px 0;font-size:13px}

/* ===== 30 天趋势（横向滚动，点击进详情） ===== */
.trend{display:flex;align-items:flex-end;gap:8px;height:84px;
  padding:0 4px;margin-top:4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.trend::-webkit-scrollbar{display:none}
.trend .day{flex:0 0 auto;width:30px;display:flex;flex-direction:column;align-items:center;gap:6px;
  cursor:pointer}
.trend .day:active{transform:scale(.92)}
.trend .bar{width:100%;max-width:22px;border-radius:4px 4px 0 0;background:linear-gradient(180deg,var(--accent2),var(--accent));
  min-height:3px;transition:height .4s;box-shadow:0 0 8px rgba(255,122,47,.25)}
.trend .bar.today{box-shadow:0 0 12px rgba(255,122,47,.6)}
.trend .lbl{font-size:10px;color:var(--muted);white-space:nowrap}
.trend .lbl.today{color:var(--accent2);font-weight:600}
.trend .v{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ===== 详情页 ===== */
.detail-summary{display:flex;gap:10px;margin:4px 0 14px}
.detail-line{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:12px 14px;display:flex;align-items:baseline;gap:6px;font-size:13px;color:var(--muted)}
.detail-line b{font-size:22px;color:var(--text);font-weight:700}
.detail-line.smoke b{color:var(--accent2)}
.detail-line.resist b{color:var(--ok)}

/* ===== 通用视图 ===== */
.view{display:none}
.view.active{display:block;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ===== 设置页 ===== */
.set-head{display:flex;align-items:center;gap:12px;padding:16px 0}
.back-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);
  background:var(--card);color:var(--text);cursor:pointer;padding:0;
  -webkit-appearance:none;appearance:none;font:inherit;
  display:flex;align-items:center;justify-content:center;
  transition:transform .18s, border-color .2s, color .2s}
.back-btn:active{transform:translateX(-2px);border-color:var(--accent);color:var(--accent2)}
.set-head h2{margin:0;font-size:18px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:16px;margin:12px 0}
.card h3{margin:0 0 12px;font-size:14px;color:var(--accent2);letter-spacing:1px}
.row{display:flex;align-items:center;justify-content:space-between;padding:8px 0}
.row .lbl{font-size:14px}
.row .hint{font-size:11px;color:var(--muted);margin-top:2px}
.row input[type=number]{width:64px;background:var(--card2);border:1px solid var(--border);
  color:var(--text);border-radius:8px;padding:8px 10px;font-size:16px;text-align:center}
/* 开关 */
.switch{position:relative;width:52px;height:30px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch .slider{position:absolute;inset:0;border-radius:15px;background:var(--card2);
  border:1px solid var(--border);transition:.25s;cursor:pointer}
.switch .slider:before{content:"";position:absolute;width:22px;height:22px;border-radius:50%;
  left:3px;top:3px;background:var(--muted);transition:.25s}
.switch input:checked + .slider{background:rgba(255,122,47,.25)}
.switch input:checked + .slider:before{transform:translateX(22px);background:var(--accent);
  box-shadow:0 0 8px rgba(255,122,47,.6)}
.btn{display:block;width:100%;padding:13px;border-radius:12px;border:1px solid var(--border);
  background:var(--card2);color:var(--text);font-size:15px;cursor:pointer;margin:8px 0;letter-spacing:1px}
.btn:active{background:var(--card)}
.btn.danger{color:var(--danger);border-color:rgba(255,92,92,.35)}
.btn.primary{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#1a0e04;
  font-weight:700;border:none;box-shadow:0 4px 16px rgba(255,122,47,.3)}

/* ===== 倒计时页 ===== */
.buffer-wrap{text-align:center;padding-top:40px}
.buffer-note{color:var(--muted);font-size:14px;letter-spacing:1px;margin-bottom:6px}
.buffer-gap{font-size:13px;color:var(--accent2);margin-bottom:30px}
.buffer-timer{font-size:88px;font-weight:800;letter-spacing:2px;
  font-variant-numeric:tabular-nums;line-height:1;
  background:linear-gradient(180deg,#fff,#ffb380);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent}
.buffer-ready{font-size:20px;color:var(--ok);margin:20px 0;font-weight:700}
.btn-approve{margin:36px auto 0;display:block;width:180px;padding:16px;border-radius:14px;border:none;
  background:linear-gradient(90deg,var(--ok),#34d399);color:#04120a;font-size:18px;font-weight:800;
  cursor:pointer;box-shadow:0 4px 20px rgba(74,222,128,.35);letter-spacing:2px}
.btn-approve:active{transform:scale(.96)}
.btn-resist{margin:14px auto 0;display:block;width:180px;padding:13px;border-radius:14px;
  border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px;cursor:pointer}
.btn-cancel{margin:26px auto 0;display:block;background:none;border:none;color:var(--muted);
  font-size:13px;text-decoration:underline;cursor:pointer}

/* 反馈浮层 */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 60px);transform:translateX(-50%) translateY(20px);
  background:var(--card);border:1px solid var(--border);color:var(--text);padding:12px 20px;
  border-radius:20px;font-size:14px;opacity:0;transition:.3s;z-index:50;pointer-events:none;
  box-shadow:0 6px 24px rgba(0,0,0,.5);white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.good{border-color:rgba(74,222,128,.5)}
.toast.bad{border-color:rgba(255,92,92,.5)}
</style>
</head>
<body>
<div id="app">

  <!-- ============ 主屏 ============ -->
  <div id="view-main" class="view active">
    <header>
      <div class="brand">
        <span class="fire">🔥</span>
        <div>
          <h1>熄火</h1>
          <div class="sub" id="date-sub"></div>
        </div>
      </div>
      <div class="gear" onclick="show('settings')">⚙️</div>
    </header>

    <div class="counter-wrap">
      <div class="count-num" id="count-num">0</div>
      <div class="count-label" id="count-label">今天已抽</div>
      <div class="resist-count" id="resist-count"></div>
      <div class="goal-bar"><div class="goal-fill" id="goal-fill" style="width:0%"></div></div>
      <div class="goal-text" id="goal-text"></div>
    </div>

    <button class="btn-smoke" id="btn-smoke"
      onpointerdown="onPressStart(event)"
      onpointerup="onPressEnd(event)"
      onpointercancel="onPressEnd(event)"
      oncontextmenu="return false">
      <div class="lighter" id="lighter">
        <div class="flame-box" id="flame-box">
          <svg class="flame-svg" viewBox="0 0 40 76" aria-hidden="true">
            <defs>
              <linearGradient id="flameO" x1="0" y1="1" x2="0" y2="0">
                <stop offset="0" stop-color="#ff8a3d"/>
                <stop offset="0.55" stop-color="#ff4d1f"/>
                <stop offset="1" stop-color="#ff2d1a"/>
              </linearGradient>
              <linearGradient id="flameI" x1="0" y1="1" x2="0" y2="0">
                <stop offset="0" stop-color="#ffd54a"/>
                <stop offset="1" stop-color="#fff7cf"/>
              </linearGradient>
            </defs>
            <path d="M20 2 C28 16 30 26 24 34 C21 40 19 40 20 74 C21 40 19 40 16 34 C10 26 12 16 20 2 Z" fill="url(#flameO)"/>
            <path d="M20 14 C24 22 25 28 21 33 C19 36 21 36 20 50 C19 36 21 36 19 33 C15 28 16 22 20 14 Z" fill="url(#flameI)"/>
          </svg>
        </div>
        <div class="sparks" id="sparks"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="lid" id="lid"><span class="lid-inner"></span></div>
        <div class="wheel" id="wheel"></div>
        <div class="guard" id="guard"></div>
        <div class="body"><span class="btn-text" id="btn-text">抽一根</span></div>
      </div>
      <span class="btn-hint" id="btn-hint"></span>
    </button>

    <div class="undo-row">
      <button class="undo-btn" id="undo-btn" onclick="undoLast()" style="display:none" aria-label="撤销上一根" title="撤销上一根">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 9h11a5 5 0 0 1 0 10H8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M8 5l-4 4 4 4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="undo-btn" id="redo-btn" onclick="redoLast()" style="display:none" aria-label="反撤销" title="反撤销">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M20 9H9a5 5 0 0 0 0 10h7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M16 5l4 4-4 4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <div class="tl-title"><span id="tl-today">今日</span></div>
    <ul class="tl" id="timeline"></ul>

    <div class="tl-title"><span>从今天起 · 点击柱子看详情</span></div>
    <div class="trend" id="trend"></div>
  </div>

  <!-- ============ 设置 ============ -->
  <div id="view-settings" class="view">
    <div class="set-head">
      <button class="back-btn" onclick="show('main')" aria-label="返回主页面">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <h2>设置</h2>
    </div>

    <div class="card">
      <h3>🎯 每日目标</h3>
      <div class="row">
        <div>
          <div class="lbl">每日上限</div>
          <div class="hint">超过后计数变红提醒</div>
        </div>
        <input type="number" id="goal-input" min="1" max="100" value="20" onchange="onGoalChange(this.value)">
      </div>
    </div>

    <div class="card">
      <h3>⏳ 等待缓冲</h3>
      <div class="row">
        <div>
          <div class="lbl">申请后先等一会儿</div>
          <div class="hint">点「申请抽烟」后倒计时，过了才能抽，给冲动冷却</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="buffer-toggle" onchange="onBufferToggle(this.checked)">
          <span class="slider"></span>
        </label>
      </div>

  </div>

let sfxAudio = null;
function ensureSfx(){
  if(!sfxAudio){
    try{ sfxAudio = new Audio(SFX_DATA); sfxAudio.preload = "auto"; }catch(e){}
  }
  return sfxAudio;
}
function playSfx(){
  try{
    const a = ensureSfx();
    if(!a) return;
    a.currentTime = 0;
    const p = a.play();
    if(p && p.catch) p.catch(function(){});
  }catch(e){}
}

function dayStr(ts){
  const d = new Date(ts);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function todayStr(){ return dayStr(Date.now()); }
function countOn(day){
  return state.records.filter(t => dayStr(t) === day).length;
}
function fmtTime(ts){
  const d = new Date(ts);
  return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}
function fmtGap(ms){
  const m = Math.round(ms / 60000);
  if (m < 1) return "不到 1 分钟";
  if (m < 60) return m + " 分钟";
  const h = Math.floor(m/60), mm = m%60;
  return h + " 小时 " + mm + " 分";
}
function toast(msg, kind){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show" + (kind ? " " + kind : "");
  clearTimeout(t._t);
  t._t = setTimeout(() => t.className = "toast", 2200);
}

/* ---------- 持久化 ---------- */
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const o = JSON.parse(raw);
      state = Object.assign({}, state, o);
    }
  }catch(e){}
}
function show(viewId){
  ["main","settings","buffer","detail"].forEach(id => document.getElementById("view-" + id).classList.toggle("active", id === viewId));
  if(viewId !== "buffer") stopBufferTimer();
  if(viewId === "main") renderMain();
  if(viewId === "settings") renderSettings();
}

/* ---------- 主屏渲染 ---------- */
function renderMain(){
  const today = todayStr();
  const n = countOn(today);
  const numEl = document.getElementById("count-num");
  numEl.textContent = n;
  numEl.classList.toggle("over", n > state.goal);

  const labelEl = document.getElementById("count-label");
  labelEl.textContent = n === 0 ? "今天还没抽，继续保持" : (n === 1 ? "今天抽了 1 根" : "今天已抽 " + n + " 根");

  // 忍住统计
  const rn = state.resisted.filter(t => dayStr(t) === today).length;
  document.getElementById("resist-count").textContent = rn > 0 ? "💪 忍住了 " + rn + " 次" : "";

  // 目标
  const fill = document.getElementById("goal-fill");
  const pct = Math.min(100, Math.round(n / state.goal * 100));
  fill.style.width = pct + "%";
  fill.classList.toggle("over", n > state.goal);
  const gt = document.getElementById("goal-text");
  if(n > state.goal){
    gt.textContent = "⚠️ 已超目标 " + (n - state.goal) + " 根";
    gt.classList.add("over");
  }else{
    gt.textContent = "目标 " + state.goal + " 根 · 剩 " + (state.goal - n) + " 根";
    gt.classList.remove("over");
  }

  // 主按钮
  const btn = document.getElementById("btn-smoke");
  btn.classList.toggle("over", n > state.goal);
  document.getElementById("btn-text").textContent = state.bufferEnabled ? "申请抽烟" : "抽一根";
  document.getElementById("btn-hint").textContent = state.bufferEnabled
    ? "长按点亮 · 到底后先等 " + state.bufferMinutes + " 分钟"
    : "长按点亮 · 到底记录";

  // 撤销 / 反撤销
  document.getElementById("undo-btn").style.display = undoStack.length ? "inline-flex" : "none";
  document.getElementById("redo-btn").style.display = redoStack.length ? "inline-flex" : "none";

  // 时间线（抽烟 + 忍住，合并倒序）
  document.getElementById("tl-today").textContent = "今日 · " + (function(){const d=new Date();return (d.getMonth()+1)+"月"+d.getDate()+"日";})();
  renderDayTimeline(today, document.getElementById("timeline"));

  // 30 天趋势（横向滚动，点击柱子进详情）
  const trend = document.getElementById("trend");
  let days = [];
  for(let i = 0; i < 30; i++){
    const d = new Date(); d.setDate(d.getDate() + i);
    days.push({ day: dayStr(d.getTime()), label: i === 0 ? "今天" : (d.getMonth()+1) + "/" + d.getDate() });
  }
  trend.innerHTML = days.map(d => {
    const c = countOn(d.day);
    const h = c === 0 ? 3 : Math.min(60, c * 5 + 3);
    return '<div class="day" data-day="' + d.day + '" onclick="showDetail(\'' + d.day + '\')"><div class="v">' + (c || "") + '</div>' +
      '<div class="bar' + (d.label === "今天" ? " today" : "") + '" style="height:' + h + 'px"></div>' +
      '<div class="lbl' + (d.label === "今天" ? " today" : "") + '">' + d.label + '</div></div>';
  }).join("");
}

/* ---------- 详情页 + 按天时间线 ---------- */
function renderDayTimeline(day, ul){
  const smoke = state.records.filter(t => dayStr(t) === day).sort((a,b)=>a-b);
  const resist = state.resisted.filter(t => dayStr(t) === day);
  const smokeGap = {};
  smoke.forEach((t, i) => { smokeGap[t] = i > 0 ? fmtGap(t - smoke[i-1]) : ""; });
  const events = [
    ...smoke.map((t, i) => ({ts:t, type:"smoke", idx: i + 1, gap: smokeGap[t]})),
    ...resist.map(t => ({ts:t, type:"resist"}))
  ].sort((a,b) => b.ts - a.ts);
  if(!events.length){
    ul.innerHTML = '<li class="empty">这一天没有记录</li>';
    return;
  }
  let html = "";
  events.forEach(ev => {
    if(ev.type === "smoke"){
      const right = ev.idx === 1 ? "第一根烟" : (ev.gap ? "隔 " + ev.gap : "");
      html += '<li><span class="dot"></span><span class="idx">第 ' + ev.idx + ' 根</span>' +
        '<span class="time">' + fmtTime(ev.ts) + '</span>' +
        '<span class="gap">' + right + '</span></li>';
    }else{
      html += '<li><span class="dot resist"></span><span class="idx" style="color:var(--ok)">忍住了</span>' +
        '<span class="time">' + fmtTime(ev.ts) + '</span>' +
        '<span class="gap" style="color:var(--ok)">💪 没抽</span></li>';
    }
  });
  ul.innerHTML = html;
}
function showDetail(day){
  const d = new Date(day + "T00:00:00");
  document.getElementById("detail-title").textContent = (d.getMonth()+1) + "月" + d.getDate() + "日";
  const smoke = state.records.filter(t => dayStr(t) === day);
  const resist = state.resisted.filter(t => dayStr(t) === day);
  document.getElementById("detail-summary").innerHTML =
    '<div class="detail-line smoke"><span>🚬 抽了</span><b>' + smoke.length + '</b><span>根</span></div>' +
    '<div class="detail-line resist"><span>💪 忍住了</span><b>' + resist.length + '</b><span>次</span></div>';
  renderDayTimeline(day, document.getElementById("detail-timeline"));
  show("detail");
}

/* ---------- 主按钮动作（长按打火机：掀盖 → 搓轮 → 点火） ---------- */
let pressStart = 0, pressRaf = null, pressDone = false;
const PRESS_MS = 1500;   // 长按到底时长，对齐音效 1.5s

function onPressStart(e){
  if(e.cancelable) e.preventDefault();
  if(e.pointerId !== undefined && e.currentTarget && e.currentTarget.setPointerCapture){
    try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(err){}
  }
  if(pressRaf) return;
  playSfx();               // 音效 = 掀盖→搓轮→点火全程声，与动画同步
  pressStart = Date.now();
  pressDone = false;
  document.getElementById("lighter").classList.remove("lit");
  pressRaf = requestAnimationFrame(animatePress);
}
function animatePress(){
  const p = Math.min(1, (Date.now() - pressStart) / PRESS_MS);
  updateLighter(p);
  if(p >= 1){
    pressDone = true;
    pressRaf = null;
    triggerSmoke();
    return;
  }
  pressRaf = requestAnimationFrame(animatePress);
}
function onPressEnd(e){
  if(e.cancelable) e.preventDefault();
  if(pressRaf){ cancelAnimationFrame(pressRaf); pressRaf = null; }
  if(!pressDone){
    resetLighter();
  }
  pressDone = false;
}
function updateLighter(p){
  const lighter = document.getElementById("lighter");
  const lid = document.getElementById("lid");
  const wheel = document.getElementById("wheel");
  // 掀盖：p 0→0.3，盖子绕顶部铰链向后翻，翻过 90° 后渐隐（翻到机身后面）
  const lidP = Math.min(1, p / 0.3);
  const angle = -165 * lidP;
  lid.style.transform = "rotateX(" + angle.toFixed(1) + "deg)";
  lid.style.opacity = lidP <= 0.55 ? "1" : Math.max(0, 1 - (lidP - 0.55) / 0.45).toFixed(2);
  // 搓轮：p 0.3→0.9，齿轮旋转 + 火花
  const wheelP = Math.min(1, Math.max(0, (p - 0.3) / 0.6));
  wheel.style.transform = "rotate(" + (wheelP * 720).toFixed(1) + "deg)";
  lighter.classList.toggle("sparking", wheelP > 0 && wheelP < 1);
}
function resetLighter(){
  const lighter = document.getElementById("lighter");
  document.getElementById("lid").style.transform = "rotateX(0deg)";
  document.getElementById("lid").style.opacity = "1";
  document.getElementById("wheel").style.transform = "rotate(0deg)";
  lighter.classList.remove("sparking");
  lighter.classList.remove("lit");
}
function triggerSmoke(){
  updateLighter(1);
  document.getElementById("lighter").classList.add("lit");   // 点火
  setTimeout(function(){ resetLighter(); }, 2200);           // 火苗亮 2 秒后熄灭
  if(state.bufferEnabled){
    startBuffer();
  }else{
    addRecord();
  }
}
function pushOp(arr, type){
  const ts = Date.now();
  arr.push(ts);
  undoStack.push({ type: type, ts: ts });
  redoStack.length = 0;
  return ts;
}
function addRecord(){
  pushOp(state.records, "smoke");
  save();
  renderMain();
  const n = countOn(todayStr());
  toast(n > state.goal ? "已记一根 · 今天 " + n + " 根，超目标了" : "已记一根 · 今天 " + n + " 根", n > state.goal ? "bad" : "good");
}
function undoLast(){
  const op = undoStack.pop();
  if(!op) return;
  const arr = op.type === "smoke" ? state.records : state.resisted;
  const i = arr.lastIndexOf(op.ts);
  if(i >= 0) arr.splice(i, 1);
  redoStack.push(op);
  save();
  renderMain();
  toast(op.type === "smoke" ? "已撤销上一根" : "已撤销「忍住了」");
}
function redoLast(){
  const op = redoStack.pop();
  if(!op) return;
  const arr = op.type === "smoke" ? state.records : state.resisted;
  arr.push(op.ts);
  undoStack.push(op);
  save();
  renderMain();
  toast("已恢复");
}

/* ---------- 等待缓冲 ---------- */
function startBuffer(){
  const now = Date.now();
  const recs = state.records.filter(t => dayStr(t) === todayStr());
  const gapEl = document.getElementById("buffer-gap");
  if(recs.length){
    gapEl.textContent = "离上一根已过 " + fmtGap(now - Math.max(...recs));
  }else{
    gapEl.textContent = "今天第一根";
  }
  bufferUntil = now + state.bufferMinutes * 60000;
  document.getElementById("buffer-ready").style.display = "none";
  document.getElementById("btn-approve").style.display = "none";
  document.getElementById("btn-givelip").style.display = "block";
  document.getElementById("btn-resist").style.display = "block";
  show("buffer");
  startBufferTimer();
}
function startBufferTimer(){
  stopBufferTimer();
  tickBuffer();
  bufferTimer = setInterval(tickBuffer, 500);
}
function stopBufferTimer(){
  if(bufferTimer){ clearInterval(bufferTimer); bufferTimer = null; }
}
function tickBuffer(){
  const remain = bufferUntil - Date.now();
  const timerEl = document.getElementById("buffer-timer");
  if(remain <= 0){
    timerEl.textContent = "00:00";
    stopBufferTimer();
    document.getElementById("buffer-ready").style.display = "block";
    document.getElementById("btn-approve").style.display = "block";
    document.getElementById("btn-givelip").style.display = "none";
    document.getElementById("btn-resist").style.display = "none";
    return;
  }
  const m = Math.floor(remain / 60000);
  const s = Math.floor((remain % 60000) / 1000);
  timerEl.textContent = String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
}
function approveSmoke(){
  addRecord();
  bufferUntil = 0;
  show("main");
}
function resistSmoke(){
  pushOp(state.resisted, "resist");
  save();
  bufferUntil = 0;
  show("main");
  const todayResist = state.resisted.filter(t => dayStr(t) === todayStr()).length;
  toast("忍住了 👍 今天已挡住 " + todayResist + " 次冲动", "good");
}
function giveLipSmoke(){
  bufferUntil = 0;
  stopBufferTimer();
  addRecord();
  show("main");
}
function cancelBuffer(){
  bufferUntil = 0;
  show("main");
}

/* ---------- 设置 ---------- */
function renderSettings(){
  document.getElementById("goal-input").value = state.goal;
  document.getElementById("buffer-toggle").checked = state.bufferEnabled;
  document.getElementById("buffer-min-input").value = state.bufferMinutes;
  document.getElementById("buffer-min-row").style.display = state.bufferEnabled ? "flex" : "none";
  document.getElementById("app-version").textContent = APP_VERSION;
}
function onGoalChange(v){
  const n = parseInt(v, 10);
  if(n && n > 0 && n <= 100){ state.goal = n; save(); renderMain(); }
}
function onBufferToggle(on){
  state.bufferEnabled = on;
  save();
  document.getElementById("buffer-min-row").style.display = on ? "flex" : "none";
  renderMain();
}
function onBufferMin(v){
  const n = parseInt(v, 10);
  if(n && n > 0 && n <= 60){ state.bufferMinutes = n; save(); }
}

/* ---------- 导出 / 导入 ---------- */
function exportData(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "熄火备份-" + todayStr() + ".json";
  a.click();
  URL.revokeObjectURL(a.href);
  toast("已导出备份");
}
function importData(input){
  const f = input.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const o = JSON.parse(r.result);
      if(!Array.isArray(o.records)) throw new Error("bad");
      if(confirm("导入会覆盖当前数据，确定？")){
        state = Object.assign({ records: [], resisted: [], goal: 20, bufferEnabled: false, bufferMinutes: 3 }, o);
        save(); renderMain(); renderSettings();
        toast("导入成功");
      }
    }catch(e){
      toast("文件格式不对", "bad");
    }
    input.value = "";
  };
  r.readAsText(f);
}
function clearAll(){
  if(!confirm("确定清空所有吸烟记录？此操作不可恢复。")) return;
  if(!confirm("再确认一次：真的要清空吗？")) return;
  state = { records: [], resisted: [], goal: state.goal, bufferEnabled: state.bufferEnabled, bufferMinutes: state.bufferMinutes };
  save(); renderMain(); renderSettings();
  toast("已清空");
}

/* ---------- Service Worker 注册（网络优先，绕过 GitHub max-age=600 缓存） ---------- */
function initServiceWorker(){
  try{
    if(typeof navigator !== "undefined" && navigator.serviceWorker){
      navigator.serviceWorker.register("sw.js", {updateViaCache:"none"}).catch(function(){});
    }
  }catch(e){}
}

/* ---------- 版本检测 + 自动清缓存强制刷新 ---------- */
function checkVersion(){
  try{
    if(typeof fetch !== "function") return;
    fetch("version.json?t=" + Date.now(), {cache:"no-store"})
      .then(function(r){ return r.json(); })
      .then(function(v){
        if(!v || !v.version) return;
        const cur = localStorage.getItem("__app_ver__");
        if(cur && cur !== v.version){
          // 检测到新版本：记录后强制刷新一次，SW 网络优先会拉到最新页面
          localStorage.setItem("__app_ver__", v.version);
          try{ location.reload(); }catch(e){}
        }else if(!cur){
          localStorage.setItem("__app_ver__", v.version);
        }
      })
      .catch(function(){});
  }catch(e){}
}

/* ---------- 启动 ---------- */
dateSub.textContent = (function(){
  const d = new Date();
  return d.getFullYear() + "年" + (d.getMonth()+1) + "月" + d.getDate() + "日 · " + "周" + "日一二三四五六"[d.getDay()];
})();
load();
renderMain();
initServiceWorker();
checkVersion();
</script>
